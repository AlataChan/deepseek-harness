[package]
name = "dsh-desktop"
version = "0.1.2-rc.1"
description = "Tauri desktop window for the installed DeepSeek Harness runtime"
authors = ["DeepSeek"]
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "dsh_desktop"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dsh-desktop"
path = "src/main.rs"

[[bin]]
name = "carrier-harness"
path = "src/bin/carrier-harness.rs"
required-features = ["harness"]

[features]
default = []
harness = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
