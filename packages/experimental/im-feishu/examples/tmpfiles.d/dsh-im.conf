d /var/lib/dsh-im/a/home 0700 dsh-im-a dsh-im-a -
d /var/lib/dsh-im/a/workspace 0700 dsh-im-a dsh-im-a -
d /var/lib/dsh-im/a/state 0700 dsh-im-a dsh-im-a -
d /var/lib/dsh-im/a/sessions 0700 dsh-im-a dsh-im-a -
d /var/lib/dsh-im/a/tmp 0700 dsh-im-a dsh-im-a -
d /var/lib/dsh-im/b 0700 dsh-im-b dsh-im-b -
d /var/lib/dsh-im/b/home 0700 dsh-im-b dsh-im-b -
d /var/lib/dsh-im/b/workspace 0700 dsh-im-b dsh-im-b -
d /var/lib/dsh-im/b/state 0700 dsh-im-b dsh-im-b -
d /var/lib/dsh-im/b/sessions 0700 dsh-im-b dsh-im-b -
