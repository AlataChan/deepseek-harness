# Keyless replay overlay for the shipped tui profile. The snapshot harness adds
# the mode-specific replay entry so source and built launches resolve the test
# plugin without adding it to the published CLI's dependency closure.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: session-title-llm
  name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none
