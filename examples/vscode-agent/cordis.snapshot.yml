# Keyless overlay for the shipped vscode profile. The extension carrier uses
# a deliberately smaller logical cap while retaining enough headroom for one
# image request larger than a physical IPC record.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: session-title-llm
  name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'
  config:
    maxImageBytes: 524288
    maxImagesPerMessage: 1
    maxMessageImageBytes: 524288
    maxImagePixels: 40000000

- id: connection-vscode
  name: '@deepseek-ai/dsh-client-connection-vscode'
  config:
    workspaceRoot: !!js ctx.vscodeStartup.workspaceRoot
    maxLogicalRpcBytes: 2097152

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                inputModalities: [text, image]
