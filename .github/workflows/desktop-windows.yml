name: Desktop Windows EXE

# Manual, release-adjacent packaging lane: builds the NSIS installer on a
# GitHub-hosted Windows runner, installs it silently, runs the Windows
# readiness gate against the INSTALLED tree, and uploads the artifact. It is
# not part of the pull-request check panel. The crate cannot be cross-compiled
# from macOS (MSVC/WebView2/NSIS), and PyInstaller cannot cross-compile the
# ask-knowledge sidecar, so this runner is the only Windows build host.

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Internal testing or signed public artifact
        type: choice
        options: [internal, public]
        default: internal

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_DESKTOP_BUILD_MODE: ${{ inputs.build_mode }}
  DSH_BUILD_ARTIFACT_NAME: octopus_DSH_Setup-${{ github.run_id }}-${{ github.run_attempt }}
  DSH_BUILD_WORKFLOW: .github/workflows/desktop-windows.yml
  DSH_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.DSH_WINDOWS_CERTIFICATE_THUMBPRINT }}
  DSH_WINDOWS_PUBLISHER: ${{ vars.DSH_WINDOWS_PUBLISHER }}
  PRIMARY_NODE_VERSION: '24'
  NODE_OPTIONS: '--max-old-space-size=12288'
  RAYON_NUM_THREADS: '2'
  # CI runs must never report to the production telemetry endpoint baked into
  # apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-exe:
    runs-on: windows-2025
    environment: ${{ inputs.build_mode == 'public' && 'desktop-signing' || 'desktop-internal' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Enable Developer Mode (symlink support)
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-js-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          # The frozen sidecar's dependency pins live in that script.
          cache: pip
          cache-dependency-path: scripts/build-kb-sidecar.mjs
      - name: Check native Windows knowledge migration durability
        shell: pwsh
        env:
          PYTHONIOENCODING: cp1252
        run: |
          python packages/experimental/desktop-ask-knowledge/tests/source-migration-controls.py
          if ($LASTEXITCODE -ne 0) { throw "Knowledge migration durability controls failed" }
      - name: Verify Rust stable toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version
      - name: Configure pnpm store path
        id: pnpm-store
        shell: pwsh
        run: |
          $store = pnpm store path --silent
          "path=$store" >> $env:GITHUB_OUTPUT
      - name: Restore pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-
      - name: Restore cargo registry caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: desktop-windows-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            desktop-windows-cargo-
      # Restore/save split so a failed build still keeps the expensive target
      # tree for the next iteration (a plain cache action saves only on success).
      - name: Restore Tauri build cache
        id: tauri-target
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/desktop/src-tauri/target
          key: desktop-windows-target-production-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/src/**', 'apps/desktop/src-tauri/build.rs', 'apps/desktop/src-tauri/tauri*.json') }}
          restore-keys: |
            desktop-windows-target-
      - name: Restore Tauri toolchain cache (NSIS)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/AppData/Local/tauri
          key: desktop-windows-tauri-tools-2.11.4
      - name: Install (immutable)
        shell: pwsh
        # See 2026-08-30-windows-refs-store-block-clone-install for the
        # ReFS block-clone rationale; detect the workspace filesystem and
        # pass --package-import-method=clone only on ReFS.
        run: >-
          $drive = (Split-Path -Qualifier $env:GITHUB_WORKSPACE).TrimEnd(':');
          $fs = (Get-Volume -DriveLetter $drive).FileSystem;
          if ($fs -eq 'ReFS') {
            corepack pnpm install --frozen-lockfile --package-import-method=clone
          } else {
            pnpm install --frozen-lockfile
          }
      - name: Import public Windows signing certificate
        if: inputs.build_mode == 'public'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.DSH_WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DSH_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE_BASE64 -or -not $env:CERTIFICATE_PASSWORD) { throw 'Missing Windows signing certificate credentials' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'desktop-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificates = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $matching = @($certificates | Where-Object { $_.HasPrivateKey -and $_.Thumbprint -eq $env:DSH_WINDOWS_CERTIFICATE_THUMBPRINT })
            if ($matching.Count -ne 1) { throw 'Imported certificate does not match the configured signing identity' }
          } finally { Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue }
      - name: Check public signing prerequisites
        shell: pwsh
        run: node --import tsx/esm scripts/verify-desktop-release.ts preflight $env:DSH_DESKTOP_BUILD_MODE windows-x64
      - name: Verify desktop release decisions and native unsigned refusal
        shell: pwsh
        run: |
          pnpm exec vitest run scripts/desktop-release-manifest.spec.ts scripts/verify-desktop-release.spec.ts scripts/desktop-release-publish.spec.ts scripts/desktop-release-github.spec.ts --maxWorkers=2
          if ($LASTEXITCODE -ne 0) { throw "Desktop release controls failed" }
      - name: Build workspace libraries and clients
        shell: pwsh
        run: pnpm run build
      - name: Build the Windows installer
        shell: pwsh
        run: node scripts/build-exe.mjs
      - name: Test canonical Windows paths through the Rust launcher
        shell: pwsh
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib runtime::tests::resolve_installed_runtime_passes_separated_argv
          if ($LASTEXITCODE -ne 0) { throw "Rust runtime launch regression failed" }
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib carrier::tests::forwards_records_in_arrival_order_without_inspecting_fields
          if ($LASTEXITCODE -ne 0) { throw "Rust companion launch regression failed" }
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib spec_tests::every_desktop_child_process_hides_its_console
          if ($LASTEXITCODE -ne 0) { throw "Rust console-window regression failed" }
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib app::tests::
          if ($LASTEXITCODE -ne 0) { throw "Rust payload seed regression failed" }
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --features harness --bin carrier-harness
          if ($LASTEXITCODE -ne 0) { throw "Rust carrier harness build failed" }
      - name: Verify native Windows installer upgrade recovery
        shell: pwsh
        run: ./scripts/tests/desktop-installer-upgrade.ps1 -NodePath apps/desktop/src-tauri/resources/node.exe
      - name: Verify publication refuses unqualified candidates before execution
        shell: pwsh
        run: ./scripts/tests/desktop-publication-guard.ps1
      - name: Install the EXE silently
        shell: pwsh
        run: |
          # NSIS is not long-path aware and the payload reaches deep into
          # resources\harness\node_modules, so the install root stays short.
          $install = 'D:\octo-dsh'
          $setups = @(Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'dist') -Filter '*.exe')
          if ($setups.Count -ne 1) { throw 'Expected one installer artifact' }
          $setup = $setups[0].FullName
          Write-Output "Installing $setup into $install"
          # `&` does not wait for a GUI-subsystem installer and leaves
          # $LASTEXITCODE unset; Start-Process -Wait owns the exit code.
          $proc = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$install" -Wait -PassThru
          Write-Output "Installer exit code: $($proc.ExitCode)"
          if (-not (Test-Path (Join-Path $install 'resources'))) {
            Write-Output '::group::Silent install diagnostics'
            if (Test-Path $setup) {
              Write-Output "Installer: $setup ($((Get-Item $setup).Length) bytes)"
            } else {
              Write-Output "Installer missing: $setup"
            }
            Write-Output "Install root exists: $(Test-Path $install)"
            if (Test-Path $install) {
              Get-ChildItem -Force $install | Out-String | Write-Output
            } else {
              Write-Output "Install root missing; listing its parent:"
              Get-ChildItem -Force (Split-Path -Parent $install) | Out-String | Write-Output
            }
            Write-Output '::endgroup::'
            throw "silent install produced no resources tree under $install (exit code $($proc.ExitCode))"
          }
          if ($proc.ExitCode -ne 0) {
            throw "Installer returned unexpected exit $($proc.ExitCode); readiness cannot qualify a failed installation"
          }
      - name: Run the Windows readiness gate
        shell: pwsh
        run: node scripts/verify-desktop-exe.mjs D:\octo-dsh
      - name: Verify installed Ask Knowledge public flows with a legacy code page
        shell: pwsh
        env:
          PYTHONIOENCODING: cp1252
        run: |
          & 'D:\octo-dsh\resources\node.exe' scripts/verify-ask-knowledge-installed-host.mjs 'D:\octo-dsh\resources'
          if ($LASTEXITCODE -ne 0) { throw "Installed Ask Knowledge acceptance failed" }
      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.DSH_BUILD_ARTIFACT_NAME }}
          path: |
            dist/*.exe
            dist/*.exe.release.json
          if-no-files-found: error
      - name: Save Tauri build cache
        if: always() && steps.tauri-target.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/desktop/src-tauri/target
          key: ${{ steps.tauri-target.outputs.cache-primary-key }}
      - name: Remove public Windows signing certificate
        if: always() && inputs.build_mode == 'public'
        shell: pwsh
        run: |
          if ($env:DSH_WINDOWS_CERTIFICATE_THUMBPRINT) {
            $certificate = "Cert:\CurrentUser\My\$env:DSH_WINDOWS_CERTIFICATE_THUMBPRINT"
            if (Test-Path $certificate) { Remove-Item $certificate -DeleteKey -Force }
          }
