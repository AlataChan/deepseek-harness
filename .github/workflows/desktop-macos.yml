name: Desktop macOS DMG
on:
  workflow_dispatch:
    inputs:
      architecture:
        type: choice
        options: [arm64, x64]
        default: arm64
      build_mode:
        description: Public mode requires pre-provisioned Developer ID and notary credentials
        type: choice
        options: [internal, public]
        default: internal
permissions:
  contents: read
concurrency:
  group: desktop-macos-${{ github.ref }}-${{ inputs.architecture }}
  cancel-in-progress: true
jobs:
  build-dmg:
    runs-on: ${{ inputs.architecture == 'x64' && 'macos-15-intel' || 'macos-15' }}
    environment: ${{ inputs.build_mode == 'public' && 'desktop-signing' || 'desktop-internal' }}
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      RAYON_NUM_THREADS: '2'
      DSH_TELEMETRY_DISABLED: '1'
      DSH_DESKTOP_BUILD_MODE: ${{ inputs.build_mode }}
      DSH_BUILD_ARTIFACT_NAME: octopus_DSH_DMG-${{ inputs.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
      DSH_BUILD_WORKFLOW: .github/workflows/desktop-macos.yml
      DSH_MAC_SIGNING_IDENTITY: ${{ vars.DSH_MAC_SIGNING_IDENTITY }}
      DSH_MAC_TEAM_ID: ${{ vars.DSH_MAC_TEAM_ID }}
      DSH_NOTARY_PROFILE: ${{ vars.DSH_NOTARY_PROFILE }}
      DSH_BUILD_ARCH: ${{ inputs.architecture }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check public signing configuration before building
        env:
          CERTIFICATE_PRESENT: ${{ secrets.DSH_MAC_CERTIFICATE_BASE64 != '' }}
          CERTIFICATE_PASSWORD_PRESENT: ${{ secrets.DSH_MAC_CERTIFICATE_PASSWORD != '' }}
          NOTARY_KEY_PRESENT: ${{ secrets.DSH_MAC_NOTARY_KEY_BASE64 != '' }}
          NOTARY_KEY_ID_PRESENT: ${{ secrets.DSH_MAC_NOTARY_KEY_ID != '' }}
          NOTARY_ISSUER_ID_PRESENT: ${{ secrets.DSH_MAC_NOTARY_ISSUER_ID != '' }}
        run: |
          set -euo pipefail
          node --import tsx/esm scripts/verify-desktop-release.ts config-preflight "$DSH_DESKTOP_BUILD_MODE" "macos-$DSH_BUILD_ARCH"
          if [[ "$DSH_DESKTOP_BUILD_MODE" == public ]]; then
            for flag in CERTIFICATE_PRESENT CERTIFICATE_PASSWORD_PRESENT NOTARY_KEY_PRESENT NOTARY_KEY_ID_PRESENT NOTARY_ISSUER_ID_PRESENT; do
              [[ "${!flag}" == true ]] || { printf 'Missing signing secret configuration: %s\n' "$flag" >&2; exit 1; }
            done
          fi
      - name: Verify desktop release decisions and native unsigned refusal
        shell: pwsh
        run: |
          pnpm exec vitest run scripts/desktop-release-manifest.spec.ts scripts/verify-desktop-release.spec.ts scripts/desktop-release-publish.spec.ts scripts/desktop-release-github.spec.ts scripts/desktop-signing-readiness.spec.ts scripts/desktop-macos-preparation.spec.ts scripts/desktop-publication-workflow.spec.ts --maxWorkers=2
          if ($LASTEXITCODE -ne 0) { throw "Desktop release controls failed" }
      - name: Build workspace libraries and clients
        run: pnpm run build
      - name: Build Tauri application
        working-directory: apps/desktop/src-tauri
        run: pnpm dlx @tauri-apps/cli@2.11.4 build --bundles app
      - name: Assemble and verify application before importing credentials
        run: bash scripts/build-dmg.sh --arch "$DSH_BUILD_ARCH" --prepare-only
      - name: Import public Developer ID and notary credentials
        if: inputs.build_mode == 'public'
        env:
          CERTIFICATE_BASE64: ${{ secrets.DSH_MAC_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DSH_MAC_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.DSH_MAC_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.DSH_MAC_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.DSH_MAC_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_BASE64:?Missing Developer ID certificate}" "${CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${NOTARY_KEY_BASE64:?Missing notary key}" "${NOTARY_KEY_ID:?Missing notary key ID}" "${NOTARY_ISSUER_ID:?Missing notary issuer}"
          keychain="$RUNNER_TEMP/desktop-signing.keychain-db"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          umask 077
          trap 'rm -f "$RUNNER_TEMP/desktop-signing.p12" "$RUNNER_TEMP/notary.p8"' EXIT
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/desktop-signing.p12"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security default-keychain -d user -s "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/desktop-signing.p12" -P "$CERTIFICATE_PASSWORD" -x -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials "$DSH_NOTARY_PROFILE" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$keychain"
      - name: Check public signing prerequisites
        run: node --import tsx/esm scripts/verify-desktop-release.ts preflight "$DSH_DESKTOP_BUILD_MODE" "macos-$DSH_BUILD_ARCH"
      - name: Assemble DMG with freshly frozen sidecar
        run: bash scripts/build-dmg.sh --arch "$DSH_BUILD_ARCH" --sign-prepared
      - name: Remove public macOS signing keychain
        if: always() && inputs.build_mode == 'public'
        run: |
          security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db"
          if [[ -f "$RUNNER_TEMP/desktop-signing.keychain-db" ]]; then security delete-keychain "$RUNNER_TEMP/desktop-signing.keychain-db"; fi
      - name: Verify mounted desktop bundle
        run: |
          set -euo pipefail
          images=(dist/*.dmg)
          [[ ${#images[@]} == 1 ]] || exit 1
          mountpoint="$(mktemp -d)"
          trap 'hdiutil detach "$mountpoint"; rmdir "$mountpoint"' EXIT
          hdiutil verify "${images[0]}"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "${images[0]}"
          bash scripts/verify-desktop-bundle.sh "$mountpoint/octopus_DSH.app"
      - name: Upload the disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.DSH_BUILD_ARTIFACT_NAME }}
          path: |
            dist/*.dmg
            dist/*.dmg.release.json
          if-no-files-found: error
