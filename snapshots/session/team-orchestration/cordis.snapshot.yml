# Replay patch shared by the team-orchestration snapshot composition. The model
# script comes from the scenario's committed session JSONL. The deepseek-official
# catalog entry carries the defaults the live adapter resolves (base composition
# config: thinking enabled, reasoningEffort max), so replay reproduces the
# recorded request header including its adapterDefaults markers.
#
# skill-filesystem watch:false matches the live composition (msg_ea4900a75d9e):
# real filesystem discovery, watcher off.

- id: skill-filesystem
  config:
    watch: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        # Per-scenario gate: only the main team-orchestration manifest sets
        # DSH_SNAPSHOT_CAUSAL_TEAM_SCHEDULE=1; the single-agent control shares
        # this composition and runs with the schedule off.
        causalTeamSchedule: !!js process.env.DSH_SNAPSHOT_CAUSAL_TEAM_SCHEDULE === '1'
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: ['off', 'low', 'high', 'max']
                defaultReasoningEffort: max
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
