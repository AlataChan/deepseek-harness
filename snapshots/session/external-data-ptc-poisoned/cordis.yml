# PTC external-data composition with one wire tool and deterministic HTTP.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: tools
  name: '@deepseek-ai/dsh-tools'
  config:
    mode: ptc

- insert:
    - id: external-data-fixture
      name: '../external-data-fixture-server.mjs'

- id: web
  name: '@deepseek-ai/dsh-web'

- id: web-fetch-http
  name: '@deepseek-ai/dsh-web-fetch-http'
  disabled: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    search: false
