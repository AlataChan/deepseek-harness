# Authored keyless replay. A self-symlink child makes the project skill root unlistable.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    dshHome: !!js process.cwd() + '/skill-user-home'
    agentsHome: !!js process.cwd() + '/skill-user-agents'
    bundledSkillDir: !!js process.cwd() + '/skill-bundled'
    watch: false

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
