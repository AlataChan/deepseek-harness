# Replay patch shared by the team-orchestration-no-tools snapshot composition.
# The deepseek-official catalog entry carries the defaults the live adapter
# resolves (base composition config: thinking enabled, reasoningEffort max), so
# replay reproduces the recorded request header including its adapterDefaults.
#
# skill-filesystem watch:false matches the live composition (msg_ea4900a75d9e):
# real filesystem discovery, watcher off.

- id: skill-filesystem
  config:
    watch: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: ['off', 'low', 'high', 'max']
                defaultReasoningEffort: max
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
