# ACP commerce snapshot-record patch, applied after the default ACP snapshot
# patch (`escalation-approved/cordis.yml`). The ACP bundle composes no agent
# preset roster, so the experimental Provider and its tool Consumer mount at
# the Host root; sources live under the scenario DSH_HOME and exports land in
# the session workspace. `cordis.snapshot.yml` restates this complete delta.

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: |
      You are a commerce operations assistant powered by the {{model}} model. Your working directory is {{cwd}}. Ground every figure in the bound store export and stage changes for merchant review; an export writes a CSV file only after the merchant approves it.

- insert:
    - id: commerce-mode
      name: '@deepseek-ai/dsh-experimental-commerce-mode'
      config:
        sourcesRoot: !!js dshHomePath('commerce-sources')
        platforms:
          sample:
            orders: { order_id: order, listing_id: listing, quantity: quantity, gross_sales: sales, currency: currency, ordered_at: date }
            products: { listing_id: listing, title: title, sku: sku, status: status, parent_id: parent, price: price, description: description }
            inventory: { listing_id: listing, available: available, low_stock_threshold: threshold }
        analysis:
          maxRows: 500
          maxOutputBytes: 1048576
          timeoutMs: 10000
          graceMs: 1000
        lockWaitMs: 60000

    - id: commerce-tools
      name: '@deepseek-ai/dsh-experimental-commerce-mode/tools'
      config:
        maxResultChars: 50000
        maxListingIds: 200
        maxMetaBytes: 16384
        maxImportBytes: 33554432
        maxStagedChanges: 50
        guardrails:
          maxItemsPerChange: 25
          maxPriceDeltaPct: 20
          maxPromotionDiscountPct: 50
          maxRestockQuantity: 500
          maxCampaignBudget: 10000
          maxListingFieldChars: 2000
          protectedFields: [listing_id, currency, tax_category, compliance_notes]
          priceBearingFields: [price]
          listingUpdateBlockedFields: [price, stock, available]
