# Replay-only patch applied after the default ACP snapshot patch instead of
# `cordis.yml`: replace the network adapter with recorded JSONL, pin the
# recorded top-level model, keep persistence raw, run the sandbox through a
# passthrough runner, and restate the commerce persona and root rows.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: acp
  name: '@deepseek-ai/dsh-acp'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: |
      You are a commerce operations assistant powered by the {{model}} model. Your working directory is {{cwd}}. Ground every figure in the bound store export and stage changes for merchant review; an export writes a CSV file only after the merchant approves it.

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: ['off', 'low', 'high', 'max']
                defaultReasoningEffort: max
              - id: deepseek-v4-pro

    - id: commerce-mode
      name: '@deepseek-ai/dsh-experimental-commerce-mode'
      config:
        sourcesRoot: !!js dshHomePath('commerce-sources')
        platforms:
          sample:
            orders: { order_id: order, listing_id: listing, quantity: quantity, gross_sales: sales, currency: currency, ordered_at: date }
            products: { listing_id: listing, title: title, sku: sku, status: status, parent_id: parent, price: price, description: description }
            inventory: { listing_id: listing, available: available, low_stock_threshold: threshold }
        analysis:
          maxRows: 500
          maxOutputBytes: 1048576
          timeoutMs: 10000
          graceMs: 1000
        lockWaitMs: 60000

    - id: commerce-tools
      name: '@deepseek-ai/dsh-experimental-commerce-mode/tools'
      config:
        maxResultChars: 50000
        maxListingIds: 200
        maxMetaBytes: 16384
        maxImportBytes: 33554432
        maxStagedChanges: 50
        guardrails:
          maxItemsPerChange: 25
          maxPriceDeltaPct: 20
          maxPromotionDiscountPct: 50
          maxRestockQuantity: 500
          maxCampaignBudget: 10000
          maxListingFieldChars: 2000
          protectedFields: [listing_id, currency, tax_category, compliance_notes]
          priceBearingFields: [price]
          listingUpdateBlockedFields: [price, stock, available]
